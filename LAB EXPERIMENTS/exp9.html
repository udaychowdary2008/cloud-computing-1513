<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMATS Hospital Information System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7fb;
            margin: 0;
        }

        header {
            background: #087f8c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            color: #087f8c;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background: #087f8c;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #055e68;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #087f8c;
            color: white;
        }

        @media(max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SIMATS Hospital</h1>
    <p>Hospital Information System - SaaS Application</p>
</header>

<div class="container">

    <h2>Patient Registration</h2>

    <form id="patientForm">

        <div class="form-grid">

            <div>
                <label>Patient Name</label>
                <input type="text" id="patientName" required>
            </div>

            <div>
                <label>Age</label>
                <input type="number" id="age" required>
            </div>

            <div>
                <label>Address</label>
                <textarea id="address" required></textarea>
            </div>

            <div>
                <label>Phone</label>
                <input type="tel" id="phone" required>
            </div>

            <div>
                <label>Email</label>
                <input type="email" id="email">
            </div>

            <div>
                <label>Attender Name</label>
                <input type="text" id="attenderName" required>
            </div>

            <div>
                <label>Attender Phone</label>
                <input type="tel" id="attenderPhone" required>
            </div>

            <div>
                <label>Doctor Name</label>
                <input type="text" id="doctorName" required>
            </div>

            <div>
                <label>Department</label>
                <select id="department">
                    <option>General Medicine</option>
                    <option>Cardiology</option>
                    <option>Neurology</option>
                    <option>Orthopaedics</option>
                    <option>Paediatrics</option>
                    <option>Dermatology</option>
                    <option>ENT</option>
                    <option>Other</option>
                </select>
            </div>

            <div>
                <label>Disease</label>
                <input type="text" id="disease" required>
            </div>

            <div>
                <label>Admission Date</label>
                <input type="date" id="admissionDate" required>
            </div>

            <div>
                <label>Patient Status</label>
                <select id="status">
                    <option>Admitted</option>
                    <option>Under Treatment</option>
                    <option>Discharged</option>
                    <option>Emergency</option>
                </select>
            </div>

        </div>

        <button type="submit">Save Patient Record</button>

    </form>

    <h2>Patient Records</h2>

    <input type="text" id="search"
           placeholder="Search patient by name..."
           onkeyup="searchPatient()">

    <table>
        <thead>
            <tr>
                <th>Patient Name</th>
                <th>Age</th>
                <th>Phone</th>
                <th>Doctor</th>
                <th>Disease</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="patientTable">
        </tbody>
    </table>

</div>

<script>

    let patients = [];

    document.getElementById("patientForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const patient = {
            name: document.getElementById("patientName").value,
            age: document.getElementById("age").value,
            address: document.getElementById("address").value,
            phone: document.getElementById("phone").value,
            email: document.getElementById("email").value,
            attenderName: document.getElementById("attenderName").value,
            attenderPhone: document.getElementById("attenderPhone").value,
            doctor: document.getElementById("doctorName").value,
            department: document.getElementById("department").value,
            disease: document.getElementById("disease").value,
            admissionDate: document.getElementById("admissionDate").value,
            status: document.getElementById("status").value
        };

        patients.push(patient);

        displayPatients(patients);

        alert("Patient record saved successfully!");

        document.getElementById("patientForm").reset();
    });


    function displayPatients(data) {

        const table = document.getElementById("patientTable");

        table.innerHTML = "";

        data.forEach(patient => {

            const row = `
                <tr>
                    <td>${patient.name}</td>
                    <td>${patient.age}</td>
                    <td>${patient.phone}</td>
                    <td>${patient.doctor}</td>
                    <td>${patient.disease}</td>
                    <td>${patient.status}</td>
                </tr>
            `;

            table.innerHTML += row;
        });
    }


    function searchPatient() {

        const searchText =
            document.getElementById("search").value.toLowerCase();

        const result = patients.filter(patient =>
            patient.name.toLowerCase().includes(searchText)
        );

        displayPatients(result);
    }

</script>

</body>
</html>
