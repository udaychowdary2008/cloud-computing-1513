<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Mark Sheet Processing System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #222;
        }

        header {
            background: #1d4ed8;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 6px;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .input-box,
        .result-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1d4ed8;
            margin-bottom: 20px;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        .subjects {
            margin-top: 25px;
        }

        .subject-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 12px;
        }

        .process-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        .process-btn:hover {
            background: #1e40af;
        }

        .student-details {
            background: #eff6ff;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .marks-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .marks-table th,
        .marks-table td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        .marks-table th {
            background: #1d4ed8;
            color: white;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .summary-card {
            padding: 18px;
            background: #eff6ff;
            border-radius: 8px;
            text-align: center;
        }

        .summary-card h3 {
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .performance {
            margin-top: 20px;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .pass {
            background: #dcfce7;
            color: #166534;
        }

        .fail {
            background: #fee2e2;
            color: #991b1b;
        }

        footer {
            margin-top: 40px;
            background: #1d4ed8;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width: 700px) {
            .student-grid,
            .summary {
                grid-template-columns: 1fr;
            }

            .subject-row {
                grid-template-columns: 1fr;
            }

            .marks-table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📊 Cloud Mark Sheet Processing System</h1>
    <p>SaaS-Based Student Result Management System</p>
</header>


<div class="container">

    <!-- Student Input -->

    <div class="input-box">

        <h2>Student Details</h2>

        <div class="student-grid">

            <div class="form-group">
                <label>Name of the Student</label>

                <input type="text"
                       id="studentName"
                       placeholder="Enter student name">
            </div>


            <div class="form-group">
                <label>Register Number</label>

                <input type="text"
                       id="regNo"
                       placeholder="Enter register number">
            </div>

        </div>


        <!-- Subjects -->

        <div class="subjects">

            <h2>Subject Marks</h2>

            <div class="subject-row">
                <input type="text"
                       value="Mathematics"
                       readonly>

                <input type="number"
                       id="maths"
                       min="0"
                       max="100"
                       placeholder="Marks">
            </div>


            <div class="subject-row">
                <input type="text"
                       value="Physics"
                       readonly>

                <input type="number"
                       id="physics"
                       min="0"
                       max="100"
                       placeholder="Marks">
            </div>


            <div class="subject-row">
                <input type="text"
                       value="Chemistry"
                       readonly>

                <input type="number"
                       id="chemistry"
                       min="0"
                       max="100"
                       placeholder="Marks">
            </div>


            <div class="subject-row">
                <input type="text"
                       value="Computer Science"
                       readonly>

                <input type="number"
                       id="computer"
                       min="0"
                       max="100"
                       placeholder="Marks">
            </div>


            <div class="subject-row">
                <input type="text"
                       value="English"
                       readonly>

                <input type="number"
                       id="english"
                       min="0"
                       max="100"
                       placeholder="Marks">
            </div>

        </div>


        <button class="process-btn"
                onclick="processMarks()">

            ⚙️ Process Mark Sheet

        </button>

    </div>


    <!-- Result -->

    <div class="result-box"
         id="resultBox"
         style="display:none;">

        <h2>📋 Mark Sheet Result</h2>

        <div class="student-details">

            <p>
                <b>Student Name:</b>
                <span id="resultName"></span>
            </p>

            <p>
                <b>Register Number:</b>
                <span id="resultReg"></span>
            </p>

        </div>


        <table class="marks-table">

            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Result</th>
                </tr>
            </thead>

            <tbody id="marksTable">

            </tbody>

        </table>


        <div class="summary">

            <div class="summary-card">
                <h3>Total</h3>
                <p id="total"></p>
            </div>

            <div class="summary-card">
                <h3>Average</h3>
                <p id="average"></p>
            </div>

            <div class="summary-card">
                <h3>Percentage</h3>
                <p id="percentage"></p>
            </div>

            <div class="summary-card">
                <h3>Rank</h3>
                <p id="rank"></p>
            </div>

        </div>


        <div class="performance"
             id="performance">

        </div>

    </div>

</div>


<footer>
    <p>Cloud Mark Sheet Processing System | SaaS Demonstration</p>
</footer>


<script>

function processMarks() {

    let name =
        document.getElementById("studentName").value;

    let regNo =
        document.getElementById("regNo").value;

    let maths =
        Number(document.getElementById("maths").value);

    let physics =
        Number(document.getElementById("physics").value);

    let chemistry =
        Number(document.getElementById("chemistry").value);

    let computer =
        Number(document.getElementById("computer").value);

    let english =
        Number(document.getElementById("english").value);


    // Validation

    if(name === "" || regNo === "") {

        alert("Please enter Student Name and Register Number.");

        return;
    }


    let marks = [
        maths,
        physics,
        chemistry,
        computer,
        english
    ];


    if(marks.some(mark => mark < 0 || mark > 100)) {

        alert("Marks must be between 0 and 100.");

        return;
    }


    // Calculation

    let total =
        maths +
        physics +
        chemistry +
        computer +
        english;

    let average =
        total / 5;

    let percentage =
        (total / 500) * 100;


    // Determine performance

    let performance = "";

    let performanceClass = "";


    if(marks.some(mark => mark < 40)) {

        performance = "FAIL - Needs Improvement";

        performanceClass = "fail";

    }

    else if(percentage >= 90) {

        performance = "Outstanding Performance";

        performanceClass = "pass";

    }

    else if(percentage >= 75) {

        performance = "Excellent Performance";

        performanceClass = "pass";

    }

    else if(percentage >= 60) {

        performance = "Very Good Performance";

        performanceClass = "pass";

    }

    else if(percentage >= 50) {

        performance = "Good Performance";

        performanceClass = "pass";

    }

    else {

        performance = "Pass - Average Performance";

        performanceClass = "pass";

    }


    // Display student details

    document.getElementById("resultName")
        .innerText = name;

    document.getElementById("resultReg")
        .innerText = regNo;


    // Display marks

    let subjects = [
        ["Mathematics", maths],
        ["Physics", physics],
        ["Chemistry", chemistry],
        ["Computer Science", computer],
        ["English", english]
    ];


    let table = "";

    subjects.forEach(function(subject) {

        let result =
            subject[1] >= 40
            ? "Pass"
            : "Fail";

        table += `
            <tr>
                <td>${subject[0]}</td>
                <td>${subject[1]}</td>
                <td>${result}</td>
            </tr>
        `;

    });


    document.getElementById("marksTable")
        .innerHTML = table;


    // Display calculations

    document.getElementById("total")
        .innerText = total + " / 500";

    document.getElementById("average")
        .innerText = average.toFixed(2);

    document.getElementById("percentage")
        .innerText = percentage.toFixed(2) + "%";


    // Sample rank

    let rank;

    if(percentage >= 90) {
        rank = "1";
    }

    else if(percentage >= 80) {
        rank = "2";
    }

    else if(percentage >= 70) {
        rank = "3";
    }

    else if(percentage >= 60) {
        rank = "4";
    }

    else {
        rank = "5+";
    }


    document.getElementById("rank")
        .innerText = rank;


    // Overall performance

    let performanceBox =
        document.getElementById("performance");

    performanceBox.innerText =
        "Overall Performance: " + performance;

    performanceBox.className =
        "performance " + performanceClass;


    document.getElementById("resultBox")
        .style.display = "block";

}

</script>

</body>
</html>
