<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chennai Property SaaS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 22px;
        }

        header h1 {
            margin-bottom: 6px;
        }

        .container {
            width: 92%;
            max-width: 1050px;
            margin: 30px auto;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .property-type {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .property-type button {
            padding: 12px 25px;
            border: 1px solid #1e3a8a;
            border-radius: 6px;
            background: white;
            color: #1e3a8a;
            cursor: pointer;
            font-weight: bold;
        }

        .property-type button.active {
            background: #1e3a8a;
            color: white;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-btn {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #1e3a8a;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #172554;
        }

        #results {
            margin-top: 25px;
        }

        .property-card {
            background: white;
            margin: 15px 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .property-card h3 {
            color: #1e3a8a;
            margin-bottom: 12px;
        }

        .property-info {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            gap: 20px;
        }

        .book-btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #16a34a;
            color: white;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .property-info {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏠 Chennai Property SaaS</h1>
    <p>Cloud-Based Property Buying & Rental System</p>
</header>

<div class="container">

    <div class="search-box">

        <!-- Property Purpose -->
        <div class="property-type">

            <button id="buyBtn"
                    class="active"
                    onclick="setPurpose('Buy')">
                Buy
            </button>

            <button id="rentBtn"
                    onclick="setPurpose('Rent')">
                Rent
            </button>

            <button id="commercialBtn"
                    onclick="setPurpose('Commercial')">
                Commercial
            </button>

            <button id="agreementBtn"
                    onclick="setPurpose('Rental Agreement')">
                Rental Agreement
            </button>

        </div>

        <!-- Search Fields -->
        <div class="form-grid">

            <div class="form-group">
                <label>Property Type</label>

                <select id="propertyType">
                    <option value="">Select Property Type</option>
                    <option>Apartment</option>
                    <option>Independent House</option>
                    <option>Villa</option>
                    <option>Plot</option>
                    <option>Office</option>
                    <option>Shop</option>
                    <option>Warehouse</option>
                </select>
            </div>

            <div class="form-group">
                <label>Area / Locality</label>

                <select id="area">
                    <option value="">Select Area</option>
                    <option>Anna Nagar</option>
                    <option>Adyar</option>
                    <option>Velachery</option>
                    <option>Tambaram</option>
                    <option>OMR</option>
                    <option>Porur</option>
                    <option>Guindy</option>
                    <option>T Nagar</option>
                    <option>Sholinganallur</option>
                    <option>Chromepet</option>
                </select>
            </div>

            <div class="form-group">
                <label>Place / Location</label>

                <input type="text"
                       id="place"
                       placeholder="Enter place">
            </div>

            <div class="form-group">
                <label>Area Size</label>

                <select id="size">
                    <option value="">Select Area</option>
                    <option>500 - 800 sq.ft</option>
                    <option>800 - 1200 sq.ft</option>
                    <option>1200 - 1800 sq.ft</option>
                    <option>1800 - 2500 sq.ft</option>
                    <option>2500+ sq.ft</option>
                </select>
            </div>

            <div class="form-group">
                <label>Price / Rent Range</label>

                <select id="range">
                    <option value="">Select Range</option>
                    <option>Below ₹10 Lakh</option>
                    <option>₹10 - ₹30 Lakh</option>
                    <option>₹30 - ₹50 Lakh</option>
                    <option>₹50 Lakh - ₹1 Crore</option>
                    <option>₹1 - ₹2 Crore</option>
                    <option>Above ₹2 Crore</option>
                </select>
            </div>

            <div class="form-group">
                <label>Property Value</label>

                <input type="number"
                       id="value"
                       placeholder="Enter property value">
            </div>

            <div class="form-group">
                <label>Bedrooms</label>

                <select id="bedrooms">
                    <option>1 BHK</option>
                    <option>2 BHK</option>
                    <option>3 BHK</option>
                    <option>4 BHK</option>
                    <option>5+ BHK</option>
                </select>
            </div>

            <div class="form-group">
                <label>Rental Agreement</label>

                <select id="agreement">
                    <option>Not Required</option>
                    <option>11 Months</option>
                    <option>1 Year</option>
                    <option>2 Years</option>
                    <option>Custom Agreement</option>
                </select>
            </div>

        </div>

        <button class="search-btn"
                onclick="searchProperty()">
            🔍 Search Properties
        </button>

    </div>

    <!-- Results -->
    <div id="results"></div>

</div>

<footer>
    <p>Chennai Property SaaS | Cloud-Based Property Management</p>
</footer>


<script>

let purpose = "Buy";

function setPurpose(type) {

    purpose = type;

    document.getElementById("buyBtn")
        .classList.remove("active");

    document.getElementById("rentBtn")
        .classList.remove("active");

    document.getElementById("commercialBtn")
        .classList.remove("active");

    document.getElementById("agreementBtn")
        .classList.remove("active");

    if(type === "Buy") {
        document.getElementById("buyBtn")
            .classList.add("active");
    }

    if(type === "Rent") {
        document.getElementById("rentBtn")
            .classList.add("active");
    }

    if(type === "Commercial") {
        document.getElementById("commercialBtn")
            .classList.add("active");
    }

    if(type === "Rental Agreement") {
        document.getElementById("agreementBtn")
            .classList.add("active");
    }
}


function searchProperty() {

    let propertyType =
        document.getElementById("propertyType").value;

    let area =
        document.getElementById("area").value;

    let place =
        document.getElementById("place").value;

    let size =
        document.getElementById("size").value;

    let range =
        document.getElementById("range").value;

    let value =
        document.getElementById("value").value;

    let bedrooms =
        document.getElementById("bedrooms").value;

    let agreement =
        document.getElementById("agreement").value;


    if(propertyType === "" ||
       area === "" ||
       range === "") {

        alert("Please select Property Type, Area and Price Range.");

        return;
    }


    document.getElementById("results").innerHTML = `

        <h2>Available Properties</h2>

        <div class="property-card">

            <h3>🏠 Premium Chennai Property</h3>

            <div class="property-info">

                <span>
                    <b>Purpose:</b> ${purpose}
                </span>

                <span>
                    <b>Property:</b> ${propertyType}
                </span>

            </div>

            <div class="property-info">

                <span>
                    <b>Area:</b> ${area}
                </span>

                <span>
                    <b>Place:</b> ${place || area}
                </span>

            </div>

            <div class="property-info">

                <span>
                    <b>Size:</b> ${size}
                </span>

                <span>
                    <b>Bedrooms:</b> ${bedrooms}
                </span>

            </div>

            <div class="property-info">

                <span>
                    <b>Price Range:</b> ${range}
                </span>

                <span>
                    <b>Property Value:</b>
                    ₹${value || "Contact Owner"}
                </span>

            </div>

            <div class="property-info">

                <span>
                    <b>Rental Agreement:</b>
                    ${agreement}
                </span>

            </div>

            <button class="book-btn"
                    onclick="contactOwner()">
                Contact Owner
            </button>

        </div>


        <div class="property-card">

            <h3>🏢 Chennai City Property</h3>

            <div class="property-info">

                <span>
                    <b>Purpose:</b> ${purpose}
                </span>

                <span>
                    <b>Location:</b> ${area}
                </span>

            </div>

            <div class="property-info">

                <span>
                    <b>Property Type:</b> ${propertyType}
                </span>

                <span>
                    <b>Area:</b> ${size}
                </span>

            </div>

            <div class="property-info">

                <span>
                    <b>Price Range:</b> ${range}
                </span>

                <span>
                    <b>Agreement:</b> ${agreement}
                </span>

            </div>

            <button class="book-btn"
                    onclick="contactOwner()">
                Contact Owner
            </button>

        </div>
    `;
}


function contactOwner() {

    alert(
        "Request submitted successfully! " +
        "The property owner will contact you."
    );

}

</script>

</body>
</html>
