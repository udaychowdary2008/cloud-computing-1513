
<!DOCTYPE html>
<html>
<head>
    <title>Virtual Hard Disk Creation</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf2f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 420px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: #1565c0;
        }

        label {
            display: block;
            text-align: left;
            margin: 15px 10px 5px;
            font-weight: bold;
        }

        input, select {
            width: 90%;
            padding: 10px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            background: #1565c0;
            color: white;
            padding: 12px 25px;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            color: green;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Virtual Hard Disk Creation</h2>
    <p>VMware Workstation</p>

    <label>Virtual Machine Name</label>
    <input type="text" id="name" value="My Virtual Machine">

    <label>Virtual Disk Size (GB)</label>
    <input type="number" id="size" value="15" min="1">

    <label>Disk Type</label>
    <select id="type">
        <option>Single File Disk</option>
        <option>Multiple Files Disk</option>
    </select>

    <label>Storage Allocation</label>
    <select id="allocation">
        <option value="dynamic">Dynamically Allocated</option>
        <option value="fixed">Pre-allocated</option>
    </select>

    <label>Disk Format</label>
    <select id="format">
        <option>VMDK</option>
    </select>

    <button onclick="createDisk()">Create Virtual Hard Disk</button>

    <div id="result"></div>

</div>

<script>
function createDisk() {

    let name = document.getElementById("name").value;
    let size = Number(document.getElementById("size").value);
    let type = document.getElementById("type").value;
    let allocation = document.getElementById("allocation").value;
    let format = document.getElementById("format").value;

    if (name.trim() === "" || size <= 0) {
        document.getElementById("result").innerHTML =
        "Please enter valid details!";
        return;
    }

    let allocationText =
        allocation === "dynamic" ?
        "Dynamically Allocated" :
        "Pre-allocated";

    document.getElementById("result").innerHTML =
        "<h3>Virtual Hard Disk Created Successfully!</h3>" +
        "VM Name: " + name + "<br>" +
        "Disk Size: " + size + " GB<br>" +
        "Disk Type: " + type + "<br>" +
        "Storage: " + allocationText + "<br>" +
        "Disk Format: " + format;
}
</script>

</body>
</html>
