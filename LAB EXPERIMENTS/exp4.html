<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIMATS Library Book Reservation</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #222;
        }

        header {
            background: #4c1d95;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 7px;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .search-box h2 {
            color: #4c1d95;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 15px;
        }

        .search-btn {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #4c1d95;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #5b21b6;
        }

        #results {
            margin-top: 30px;
        }

        .book-card {
            background: white;
            margin: 15px 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .book-card h3 {
            color: #4c1d95;
            margin-bottom: 15px;
        }

        .book-info {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 9px 0;
        }

        .status-available {
            color: #16a34a;
            font-weight: bold;
        }

        .status-taken {
            color: #dc2626;
            font-weight: bold;
        }

        .reserve-btn {
            margin-top: 15px;
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            background: #16a34a;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .reserve-btn:hover {
            background: #15803d;
        }

        .reserve-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        footer {
            margin-top: 40px;
            background: #4c1d95;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .book-info {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 SIMATS Library</h1>
    <p>Cloud-Based Library Book Reservation System</p>
</header>


<div class="container">

    <div class="search-box">

        <h2>🔍 Search Library Books</h2>

        <div class="form-grid">

            <!-- Book Title -->
            <div class="form-group">
                <label>Title of the Book</label>

                <input type="text"
                       id="title"
                       placeholder="Enter book title">
            </div>


            <!-- Author -->
            <div class="form-group">
                <label>Author</label>

                <input type="text"
                       id="author"
                       placeholder="Enter author name">
            </div>


            <!-- Publication -->
            <div class="form-group">
                <label>Publication</label>

                <input type="text"
                       id="publication"
                       placeholder="Enter publication">
            </div>


            <!-- Year -->
            <div class="form-group">
                <label>Year</label>

                <select id="year">

                    <option value="">Select Year</option>

                    <option>2026</option>
                    <option>2025</option>
                    <option>2024</option>
                    <option>2023</option>
                    <option>2022</option>
                    <option>2021</option>
                    <option>2020</option>

                </select>
            </div>


            <!-- Edition -->
            <div class="form-group">
                <label>Edition</label>

                <select id="edition">

                    <option>1st Edition</option>
                    <option>2nd Edition</option>
                    <option>3rd Edition</option>
                    <option>4th Edition</option>
                    <option>5th Edition</option>

                </select>
            </div>


            <!-- Number of Copies -->
            <div class="form-group">
                <label>No. of Copies</label>

                <input type="number"
                       id="copies"
                       min="1"
                       placeholder="Number of copies">
            </div>


            <!-- Rack Number -->
            <div class="form-group">
                <label>Rack No.</label>

                <input type="text"
                       id="rack"
                       placeholder="Example: R-101">
            </div>


            <!-- Status -->
            <div class="form-group">
                <label>Status</label>

                <select id="status">

                    <option>Returned</option>
                    <option>Taken</option>

                </select>
            </div>

        </div>


        <button class="search-btn"
                onclick="searchBooks()">

            🔍 Search Books

        </button>

    </div>


    <!-- Search Results -->

    <div id="results"></div>

</div>


<footer>

    <p>
        SIMATS Library | Cloud SaaS Demonstration
    </p>

</footer>


<script>

function searchBooks() {

    let title =
        document.getElementById("title").value;

    let author =
        document.getElementById("author").value;

    let publication =
        document.getElementById("publication").value;

    let year =
        document.getElementById("year").value;

    let edition =
        document.getElementById("edition").value;

    let copies =
        document.getElementById("copies").value;

    let rack =
        document.getElementById("rack").value;

    let status =
        document.getElementById("status").value;


    if(title === "" && author === "" && publication === "") {

        alert(
            "Please enter Book Title, Author or Publication."
        );

        return;
    }


    // Sample library records

    let book1 = {
        title: title || "Introduction to Computer Science",
        author: author || "Robert Lafore",
        publication: publication || "Pearson",
        year: year || "2024",
        edition: edition,
        copies: copies || "5",
        rack: rack || "R-101",
        status: status
    };


    let book2 = {

        title: "Database Management Systems",
        author: "Raghu Ramakrishnan",
        publication: "McGraw Hill",
        year: "2023",
        edition: "3rd Edition",
        copies: "4",
        rack: "R-102",
        status: "Returned"

    };


    let book3 = {

        title: "Artificial Intelligence",
        author: "Stuart Russell",
        publication: "Pearson",
        year: "2022",
        edition: "4th Edition",
        copies: "2",
        rack: "R-103",
        status: "Taken"

    };


    displayBook(book1);

    displayBook(book2);

    displayBook(book3);

}


function displayBook(book) {

    let results =
        document.getElementById("results");


    let statusClass =
        book.status === "Returned"
        ? "status-available"
        : "status-taken";


    let buttonDisabled =
        book.status === "Taken"
        ? "disabled"
        : "";


    results.innerHTML += `

        <div class="book-card">

            <h3>📖 ${book.title}</h3>


            <div class="book-info">

                <span>
                    <b>Author:</b>
                    ${book.author}
                </span>

                <span>
                    <b>Publication:</b>
                    ${book.publication}
                </span>

            </div>


            <div class="book-info">

                <span>
                    <b>Year:</b>
                    ${book.year}
                </span>

                <span>
                    <b>Edition:</b>
                    ${book.edition}
                </span>

            </div>


            <div class="book-info">

                <span>
                    <b>No. of Copies:</b>
                    ${book.copies}
                </span>

                <span>
                    <b>Rack No:</b>
                    ${book.rack}
                </span>

            </div>


            <div class="book-info">

                <span>
                    <b>Status:</b>

                    <span class="${statusClass}">
                        ${book.status}
                    </span>

                </span>

            </div>


            <button class="reserve-btn"
                    ${buttonDisabled}
                    onclick="reserveBook('${book.title}')">

                ${book.status === "Taken"
                    ? "Currently Taken"
                    : "Reserve Book"}

            </button>

        </div>
    `;
}


function reserveBook(title) {

    alert(
        "Book reserved successfully!\\n\\n" +
        "Book: " + title +
        "\\n\\nPlease collect the book from SIMATS Library."
    );

}

</script>

</body>
</html>
